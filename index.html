<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WWM Soundboard</title>
<style>
  :root{
    --bg-deep:#040c24;
    --bg-mid:#0a1c4a;
    --ring:#123a8f;
    --blue-glow:#3f7bff;
    --blue-light:#8fb8ff;
    --gold:#f2b634;
    --gold-dim:#7a5c1c;
    --green:#1fae5e;
    --green-glow:#2fe888;
    --red:#d92e3d;
    --red-glow:#ff5a67;
    --panel:#0d1f52;
    --panel-border:#1c3f95;
    --text:#eaf1ff;
    --text-dim:#9fb4e6;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    min-height:100vh;
    font-family:'Segoe UI', Arial, sans-serif;
    color:var(--text);
    background:
      radial-gradient(circle at 50% 15%, rgba(63,123,255,0.25) 0%, rgba(63,123,255,0) 40%),
      repeating-radial-gradient(circle at 50% -10%, transparent 0, transparent 60px, rgba(63,123,255,0.06) 61px, rgba(63,123,255,0.06) 63px),
      linear-gradient(180deg, var(--bg-deep) 0%, var(--bg-mid) 55%, var(--bg-deep) 100%);
    background-attachment:fixed;
  }

  .stage{
    max-width:980px;
    margin:0 auto;
    padding:32px 20px 60px;
  }

  header{
    text-align:center;
    margin-bottom:28px;
  }

  header .eyebrow{
    letter-spacing:6px;
    font-size:12px;
    color:var(--gold);
    text-transform:uppercase;
    margin-bottom:8px;
  }

  h1{
    font-family:'Impact','Arial Narrow',sans-serif;
    font-weight:400;
    font-size:clamp(28px,6vw,46px);
    letter-spacing:2px;
    margin:0;
    text-transform:uppercase;
    background:linear-gradient(180deg,#fff 0%, var(--gold) 60%, #a8781c 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    text-shadow:0 0 30px rgba(242,182,52,0.25);
  }

  h1 .diamond{
    display:inline-block;
    width:14px;height:14px;
    background:var(--blue-glow);
    transform:rotate(45deg);
    margin:0 14px;
    box-shadow:0 0 12px var(--blue-glow);
  }

  /* Tabs */
  .tabs{
    display:flex;
    justify-content:center;
    gap:14px;
    margin-bottom:26px;
  }

  .tab-btn{
    position:relative;
    padding:12px 30px;
    background:linear-gradient(180deg, #10245c, #081335);
    border:1px solid var(--panel-border);
    color:var(--text-dim);
    font-size:15px;
    font-weight:700;
    letter-spacing:1px;
    text-transform:uppercase;
    border-radius:8px 8px 0 0;
    cursor:pointer;
    transition:all .2s ease;
  }

  .tab-btn:hover{ color:var(--text); }

  .tab-btn.active{
    color:#04102c;
    background:linear-gradient(180deg, var(--blue-light), var(--blue-glow));
    box-shadow:0 0 18px rgba(63,123,255,0.6);
    border-color:var(--blue-glow);
  }

  .panel{
    background:linear-gradient(180deg, rgba(13,31,82,0.85), rgba(6,15,42,0.9));
    border:1px solid var(--panel-border);
    border-radius:4px 16px 16px 16px;
    padding:30px;
    box-shadow:0 0 40px rgba(20,50,140,0.35), inset 0 0 60px rgba(63,123,255,0.05);
  }

  .tab-content{ display:none; }
  .tab-content.active{ display:block; animation:fadeIn .25s ease; }

  @keyframes fadeIn{
    from{opacity:0; transform:translateY(4px);}
    to{opacity:1; transform:translateY(0);}
  }

  .section-label{
    font-size:12px;
    letter-spacing:3px;
    text-transform:uppercase;
    color:var(--text-dim);
    margin:0 0 16px;
    border-left:3px solid var(--gold);
    padding-left:10px;
  }

  /* Grid of normal sound buttons */
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(170px, 1fr));
    gap:16px;
  }

  .sound-btn{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:10px;
    padding:18px 12px;
    min-height:120px;
    background:linear-gradient(160deg, #142c72 0%, #0a1638 100%);
    border:1px solid var(--panel-border);
    border-radius:10px;
    color:var(--text);
    font-size:14px;
    font-weight:600;
    text-align:center;
    cursor:pointer;
    overflow:hidden;
    transition:transform .12s ease, box-shadow .2s ease, border-color .2s ease;
  }

  .sound-btn img{
    width:44px;
    height:44px;
    object-fit:cover;
    border-radius:8px;
    border:1px solid rgba(255,255,255,0.15);
  }

  .sound-btn .icon-fallback{
    width:44px;
    height:44px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    border-radius:8px;
    background:rgba(63,123,255,0.15);
    border:1px dashed var(--panel-border);
  }

  .sound-btn:hover{
    transform:translateY(-2px);
    border-color:var(--blue-glow);
    box-shadow:0 6px 18px rgba(63,123,255,0.25);
  }

  .sound-btn.playing{
    border-color:var(--gold);
    box-shadow:0 0 0 2px var(--gold), 0 0 22px rgba(242,182,52,0.5);
    animation:pulse 1.1s ease-in-out infinite;
  }

  @keyframes pulse{
    0%,100%{ box-shadow:0 0 0 2px var(--gold), 0 0 14px rgba(242,182,52,0.35); }
    50%{ box-shadow:0 0 0 2px var(--gold), 0 0 26px rgba(242,182,52,0.7); }
  }

  .sound-btn.missing{
    animation:shake .4s ease;
    border-color:var(--red-glow);
  }

  @keyframes shake{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-4px);}
    75%{transform:translateX(4px);}
  }

  .status-dot{
    position:absolute;
    top:8px; right:8px;
    width:8px; height:8px;
    border-radius:50%;
    background:transparent;
  }
  .sound-btn.playing .status-dot{
    background:var(--gold);
    box-shadow:0 0 8px var(--gold);
  }

  /* Big Richtig/Falsch buttons */
  .big-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
    margin-bottom:30px;
  }

  .big-btn{
    padding:34px 20px;
    border-radius:16px;
    border:none;
    font-size:clamp(20px,3vw,30px);
    font-weight:900;
    letter-spacing:2px;
    text-transform:uppercase;
    color:#04102c;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    transition:transform .12s ease, box-shadow .2s ease;
    position:relative;
  }

  .big-btn.correct{
    background:linear-gradient(180deg, var(--green-glow), var(--green));
    box-shadow:0 8px 0 #0d6d3c, 0 10px 24px rgba(31,174,94,0.4);
  }
  .big-btn.wrong{
    background:linear-gradient(180deg, var(--red-glow), var(--red));
    box-shadow:0 8px 0 #8f1c27, 0 10px 24px rgba(217,46,61,0.4);
  }

  .big-btn:hover{ transform:translateY(-2px); }
  .big-btn:active{ transform:translateY(2px); }

  .big-btn.playing{
    animation:bigPulse 0.9s ease-in-out infinite;
  }
  @keyframes bigPulse{
    0%,100%{ filter:brightness(1); }
    50%{ filter:brightness(1.25); }
  }

  .big-btn img{
    width:40px;height:40px;object-fit:cover;border-radius:8px;
    border:2px solid rgba(0,0,0,0.25);
  }

  /* Info box */
  .info-box{
    margin-top:34px;
    background:rgba(6,15,42,0.7);
    border:1px dashed var(--panel-border);
    border-radius:10px;
    padding:20px 24px;
    font-size:13.5px;
    line-height:1.6;
    color:var(--text-dim);
  }
  .info-box h3{
    margin:0 0 10px;
    color:var(--gold);
    font-size:14px;
    letter-spacing:1px;
    text-transform:uppercase;
  }
  .info-box code{
    background:rgba(63,123,255,0.15);
    padding:1px 6px;
    border-radius:4px;
    color:var(--blue-light);
  }
  .info-box ul{ margin:8px 0; padding-left:20px; }
  .info-box table{ width:100%; border-collapse:collapse; margin-top:10px; font-size:13px;}
  .info-box th, .info-box td{ text-align:left; padding:6px 8px; border-bottom:1px solid var(--panel-border); }
  .info-box th{ color:var(--gold); }

  footer{
    text-align:center;
    margin-top:24px;
    font-size:12px;
    color:var(--text-dim);
    opacity:0.7;
  }
</style>
</head>
<body>

<div class="stage">
  <header>
    <div class="eyebrow">Spielshow Soundboard</div>
    <h1><span class="diamond"></span>Wer wird Millionär<span class="diamond"></span></h1>
  </header>

  <div class="tabs">
    <button class="tab-btn active" data-tab="intro">Intro</button>
    <button class="tab-btn" data-tab="quiz">Quiz</button>
  </div>

  <div class="panel">

    <!-- TAB 1: INTRO -->
    <div class="tab-content active" id="tab-intro">
      <p class="section-label">Intro-Sounds</p>
      <div class="grid" id="grid-intro"></div>
    </div>

    <!-- TAB 2: QUIZ -->
    <div class="tab-content" id="tab-quiz">
      <p class="section-label">Antwort</p>
      <div class="big-row" id="grid-big"></div>

      <p class="section-label">Weitere Sounds</p>
      <div class="grid" id="grid-quiz"></div>
    </div>

  </div>

  <footer>Lokale HTML-Datei &middot; keine Internetverbindung nötig, sobald Sounds &amp; Bilder abgelegt sind</footer>
</div>

<script>
  // ---------------------------------------------------------------
  // KONFIGURATION DER BUTTONS
  // id  = Dateiname (ohne Endung) für sounds/<id>.mp3 und images/<id>.jpg
  // label = angezeigter Text auf dem Button
  // Weitere Buttons einfach unten in die Arrays einfügen.
  // ---------------------------------------------------------------

  const introSounds = [
    { id: "Theme",        label: "Theme (Titelmusik)" },
    { id: "Begruessung",  label: "Begrüßung" },
    { id: "Spannung1",    label: "Fragen 1-5 (50-500)" },
    { id: "Spannung2",    label: "Fragen 6-10 (1000-16000" },
    { id: "Spannung3",    label: "Fragen 11-14 (32000-500000" },
    { id: "Spannung4",    label: "1 Millonen Frage" },
    { id: "Gewinnstufe",  label: "Gewinnstufe erreicht" },
  ];

  const bigSounds = [
    { id: "Richtig", label: "Richtig", type: "correct" },
    { id: "Falsch",  label: "Falsch",  type: "wrong" },
  ];

  const quizSounds = [
    { id: "Publikumsjoker",   label: "Publikumsjoker" },
    { id: "Telefonjoker",     label: "Telefonjoker" },
    { id: "FuenfzigFuenfzig", label: "50:50" },
    { id: "Ticken",           label: "Ticken (Bedenkzeit)" },
    { id: "Gewonnen",         label: "Gewonnen" },
    { id: "Verloren",         label: "Verloren" },
  ];

  // ---------------------------------------------------------------
  // Player-Logik
  // ---------------------------------------------------------------

  let currentAudio = null;
  let currentBtnEl = null;

  function soundPath(id){ return `sounds/${id}.mp3`; }
  function imagePath(id){ return `images/${id}.jpg`; }

  function stopCurrent(){
    if(currentAudio){
      currentAudio.pause();
      currentAudio.currentTime = 0;
    }
    if(currentBtnEl){
      currentBtnEl.classList.remove("playing");
    }
    currentAudio = null;
    currentBtnEl = null;
  }

  function toggleSound(id, btnEl){
    // Gleicher Button erneut geklickt -> stoppen
    if(currentBtnEl === btnEl && currentAudio){
      stopCurrent();
      return;
    }

    // Anderen laufenden Sound stoppen
    stopCurrent();

    const audio = new Audio(soundPath(id));
    audio.addEventListener("ended", () => {
      btnEl.classList.remove("playing");
      currentAudio = null;
      currentBtnEl = null;
    });
    audio.addEventListener("error", () => {
      btnEl.classList.remove("playing");
      btnEl.classList.add("missing");
      setTimeout(() => btnEl.classList.remove("missing"), 500);
      console.warn(`Sound-Datei nicht gefunden: ${soundPath(id)}`);
      currentAudio = null;
      currentBtnEl = null;
    });

    audio.play().catch(() => {
      btnEl.classList.add("missing");
      setTimeout(() => btnEl.classList.remove("missing"), 500);
    });

    btnEl.classList.add("playing");
    currentAudio = audio;
    currentBtnEl = btnEl;
  }

  function makeThumb(id){
    const img = document.createElement("img");
    img.src = imagePath(id);
    img.alt = "";
    img.onerror = function(){
      const fallback = document.createElement("div");
      fallback.className = "icon-fallback";
      fallback.textContent = "🔊";
      img.replaceWith(fallback);
    };
    return img;
  }

  function buildSoundButton(item){
    const btn = document.createElement("button");
    btn.className = "sound-btn";
    btn.appendChild(makeThumb(item.id));
    const span = document.createElement("span");
    span.textContent = item.label;
    btn.appendChild(span);
    const dot = document.createElement("span");
    dot.className = "status-dot";
    btn.appendChild(dot);
    btn.addEventListener("click", () => toggleSound(item.id, btn));
    return btn;
  }

  function buildBigButton(item){
    const btn = document.createElement("button");
    btn.className = `big-btn ${item.type}`;
    btn.appendChild(makeThumb(item.id));
    const span = document.createElement("span");
    span.textContent = item.label;
    btn.appendChild(span);
    btn.addEventListener("click", () => toggleSound(item.id, btn));
    return btn;
  }

  function render(){
    const gridIntro = document.getElementById("grid-intro");
    introSounds.forEach(item => gridIntro.appendChild(buildSoundButton(item)));

    const gridBig = document.getElementById("grid-big");
    bigSounds.forEach(item => gridBig.appendChild(buildBigButton(item)));

    const gridQuiz = document.getElementById("grid-quiz");
    quizSounds.forEach(item => gridQuiz.appendChild(buildSoundButton(item)));

    // Tabelle im Info-Kasten füllen
    const tbody = document.querySelector("#filetable tbody");
    [...introSounds, ...bigSounds, ...quizSounds].forEach(item => {
      const tr = document.createElement("tr");
      tr.innerHTML = `<td>${item.label}</td><td>sounds/${item.id}.mp3</td><td>images/${item.id}.jpg</td>`;
      tbody.appendChild(tr);
    });
  }

  // ---------------------------------------------------------------
  // Tabs
  // ---------------------------------------------------------------

  function initTabs(){
    const tabButtons = document.querySelectorAll(".tab-btn");
    tabButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        stopCurrent();
        tabButtons.forEach(b => b.classList.remove("active"));
        document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));
        btn.classList.add("active");
        document.getElementById(`tab-${btn.dataset.tab}`).classList.add("active");
      });
    });
  }

  render();
  initTabs();
</script>

</body>
</html>
